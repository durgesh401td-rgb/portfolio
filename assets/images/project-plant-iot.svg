<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="plantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062817" />
      <stop offset="100%" stop-color="#0f3d26" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="iotGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="600" height="380" rx="12" fill="url(#plantBg)" />
  
  <!-- Header -->
  <rect width="600" height="44" rx="12" fill="#042012" />
  <rect y="34" width="600" height="10" fill="#042012" />
  <circle cx="24" cy="22" r="5" fill="#ef4444" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" />
  <circle cx="56" cy="22" r="5" fill="#10b981" />
  <text x="82" y="27" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#6ee7b7">🌱 Smart Plant Monitoring System | ESP8266 IoT Node</text>
  <rect x="460" y="11" width="120" height="22" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1" />
  <text x="520" y="26" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#a7f3d0">ESP8266 Wi-Fi</text>

  <!-- Left: Sensor Live Telemetry Dashboard -->
  <g transform="translate(25, 65)">
    <!-- Soil Moisture KPI -->
    <rect width="165" height="85" rx="8" fill="#042012" stroke="#065f46" stroke-width="1" filter="url(#iotGlow)" />
    <text x="14" y="24" font-family="sans-serif" font-size="10" fill="#a7f3d0">SOIL MOISTURE</text>
    <text x="14" y="58" font-family="sans-serif" font-weight="bold" font-size="26" fill="#34d399">68%</text>
    <text x="75" y="58" font-family="monospace" font-size="10" fill="#6ee7b7">● OPTIMAL</text>
    <rect x="14" y="68" width="137" height="6" rx="3" fill="#064e3b" />
    <rect x="14" y="68" width="93" height="6" rx="3" fill="#10b981" />

    <!-- Ambient Temperature KPI -->
    <rect y="98" width="165" height="85" rx="8" fill="#042012" stroke="#065f46" stroke-width="1" />
    <text x="14" y="122" font-family="sans-serif" font-size="10" fill="#a7f3d0">TEMPERATURE</text>
    <text x="14" y="156" font-family="sans-serif" font-weight="bold" font-size="26" fill="#fbbf24">24.6°C</text>
    <rect x="14" y="166" width="137" height="6" rx="3" fill="#064e3b" />
    <rect x="14" y="166" width="80" height="6" rx="3" fill="#f59e0b" />

    <!-- Humidity KPI -->
    <rect y="196" width="165" height="85" rx="8" fill="#042012" stroke="#065f46" stroke-width="1" />
    <text x="14" y="220" font-family="sans-serif" font-size="10" fill="#a7f3d0">AIR HUMIDITY (DHT11)</text>
    <text x="14" y="254" font-family="sans-serif" font-weight="bold" font-size="26" fill="#38bdf8">58%</text>
    <rect x="14" y="264" width="137" height="6" rx="3" fill="#064e3b" />
    <rect x="14" y="264" width="85" height="6" rx="3" fill="#38bdf8" />
  </g>

  <!-- Right: Microcontroller Schematic & Status Chart -->
  <g transform="translate(210, 65)">
    <rect width="365" height="286" rx="8" fill="#042012" stroke="#065f46" stroke-width="1" />
    <text x="18" y="26" font-family="sans-serif" font-weight="bold" font-size="12" fill="#d1fae5">Real-Time Microcontroller Telemetry &amp; Actuation</text>
    
    <!-- ESP8266 Chip Board Visual -->
    <g transform="translate(20, 45)">
      <rect width="180" height="110" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <rect x="15" y="15" width="50" height="40" rx="4" fill="#022c1b" stroke="#10b981" stroke-width="1" />
      <text x="40" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#6ee7b7">ESP8266</text>
      <circle cx="150" cy="30" r="5" fill="#34d399" />
      <text x="150" y="46" text-anchor="middle" font-family="monospace" font-size="7" fill="#a7f3d0">Wi-Fi</text>
      <!-- Pins -->
      <line x1="20" y1="110" x2="20" y2="125" stroke="#fbbf24" stroke-width="3" />
      <line x1="40" y1="110" x2="40" y2="125" stroke="#fbbf24" stroke-width="3" />
      <line x1="60" y1="110" x2="60" y2="125" stroke="#fbbf24" stroke-width="3" />
      <line x1="80" y1="110" x2="80" y2="125" stroke="#fbbf24" stroke-width="3" />
      <line x1="100" y1="110" x2="100" y2="125" stroke="#fbbf24" stroke-width="3" />
      <line x1="120" y1="110" x2="120" y2="125" stroke="#fbbf24" stroke-width="3" />
      <line x1="140" y1="110" x2="140" y2="125" stroke="#fbbf24" stroke-width="3" />
      <line x1="160" y1="110" x2="160" y2="125" stroke="#fbbf24" stroke-width="3" />
      
      <text x="15" y="80" font-family="monospace" font-size="8" fill="#d1fae5">ADC0: Analog Moisture</text>
      <text x="15" y="95" font-family="monospace" font-size="8" fill="#d1fae5">GPIO4: Water Relay (AUTO)</text>
    </g>

    <!-- Plant Icon visual -->
    <g transform="translate(240, 45)">
      <circle cx="50" cy="55" r="45" fill="#065f46" opacity="0.4" />
      <path d="M50 85 Q 50 45 35 30 Q 55 40 50 85 Z" fill="url(#leafGrad)" />
      <path d="M50 70 Q 50 35 65 25 Q 52 45 50 70 Z" fill="url(#leafGrad)" />
      <rect x="35" y="85" width="30" height="20" rx="3" fill="#78350f" />
    </g>

    <!-- Serial Monitor Output Box -->
    <rect x="18" y="180" width="328" height="90" rx="6" fill="#02140b" stroke="#065f46" stroke-width="1" />
    <text x="28" y="200" font-family="monospace" font-size="9" fill="#34d399">[ESP8266] Connected to Wi-Fi SSID: 'PlantLab_IoT'</text>
    <text x="28" y="218" font-family="monospace" font-size="9" fill="#a7f3d0">[Sensors] Read Moisture: 68% | DHT11: 24.6C, 58% RH</text>
    <text x="28" y="236" font-family="monospace" font-size="9" fill="#fbbf24">[Actuator] Soil threshold optimal. Pump Relay: OFF</text>
    <text x="28" y="254" font-family="monospace" font-size="9" fill="#38bdf8">[Cloud MQTT] Telemetry synchronized (HTTP 200 OK)</text>
  </g>
</svg>
