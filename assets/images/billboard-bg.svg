<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spotlight" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#3b0764" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#0B0B0B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#141414" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="fadeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="60%" stop-color="#141414" stop-opacity="0" />
      <stop offset="100%" stop-color="#141414" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#141414" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#141414" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1920" height="1080" fill="#141414" />
  
  <!-- Ambient Spotlight Glow -->
  <rect width="1920" height="1080" fill="url(#spotlight)" />

  <!-- Abstract Cinematic Geometric Nodes / AI Wave Grid in Background -->
  <g opacity="0.15" stroke="#E50914" stroke-width="1.5">
    <circle cx="1400" cy="400" r="280" fill="none" stroke-dasharray="12 8" />
    <circle cx="1400" cy="400" r="180" fill="none" stroke-dasharray="6 6" />
    <line x1="1100" y1="400" x2="1700" y2="400" />
    <line x1="1400" y1="100" x2="1400" y2="700" />
    <line x1="1200" y1="200" x2="1600" y2="600" />
    <line x1="1200" y1="600" x2="1600" y2="200" />
  </g>

  <!-- Constellation Nodes representing IoT & AI Connectivity -->
  <g opacity="0.4" fill="#E50914">
    <circle cx="1300" cy="320" r="6" />
    <circle cx="1480" cy="280" r="5" />
    <circle cx="1520" cy="460" r="7" />
    <circle cx="1350" cy="510" r="5" />
    <circle cx="1230" cy="420" r="6" />
  </g>
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5">
    <line x1="1300" y1="320" x2="1480" y2="280" />
    <line x1="1480" y1="280" x2="1520" y2="460" />
    <line x1="1520" y1="460" x2="1350" y2="510" />
    <line x1="1350" y1="510" x2="1230" y2="420" />
    <line x1="1230" y1="420" x2="1300" y2="320" />
  </g>

  <!-- Left Darkness overlay for legible text -->
  <rect width="1920" height="1080" fill="url(#fadeLeft)" />
  
  <!-- Bottom Gradient Fading to Row 1 -->
  <rect width="1920" height="1080" fill="url(#fadeBottom)" />
</svg>
