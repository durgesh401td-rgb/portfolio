<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="netflixRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B81D24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>
  <!-- Stylized DURFLIX logo text with slight arch and bold cinema kerning -->
  <g filter="url(#shadow)">
    <text x="10" y="58" font-family="'Bebas Neue', 'Arial Black', Impact, sans-serif" font-size="54" font-weight="900" fill="url(#netflixRed)" letter-spacing="3">
      DURFLIX
    </text>
  </g>
  <!-- Red accent underline curve -->
  <path d="M 12 68 Q 160 76 308 68" fill="none" stroke="#E50914" stroke-width="3" stroke-linecap="round" opacity="0.8" />
</svg>
