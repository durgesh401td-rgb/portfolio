    <text x="18" y="38" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">DURGESH SONAR</text>
    <text x="18" y="52" font-family="sans-serif" font-size="9" fill="#0284c7">B.Tech CSE (AI &amp; ML) | Sandip University</text>
    
    <line x1="18" y1="62" x2="262" y2="62" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="18" y="78" font-family="sans-serif" font-weight="bold" font-size="10" fill="#334155">PROFILE SUMMARY</text>
    <rect x="18" y="85" width="244" height="22" rx="3" fill="#f8fafc" />
