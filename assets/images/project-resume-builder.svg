    <rect x="75" y="38" width="55" height="4" rx="2" fill="#38bdf8" />
    <rect x="134" y="38" width="55" height="4" rx="2" fill="#38bdf8" />
    <rect x="193" y="38" width="40" height="4" rx="2" fill="#475569" />

    <!-- Input fields simulation -->
    <rect x="16" y="55" width="218" height="32" rx="5" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="26" y="75" font-family="sans-serif" font-size="11" fill="#f8fafc">Durgesh Sonar</text>

    <rect x="16" y="98" width="218" height="32" rx="5" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="26" y="118" font-family="sans-serif" font-size="11" fill="#94a3b8">B.Tech CSE (AI &amp; ML)</text>

    <rect x="16" y="142" width="218" height="60" rx="5" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="26" y="160" font-family="sans-serif" font-size="10" fill="#cbd5e1">Skills: Python, C++, IoT, Web</text>
    <text x="26" y="176" font-family="sans-serif" font-size="10" fill="#94a3b8">Projects: Smart Plant Monitoring...</text>

    <rect x="16" y="215" width="218" height="36" rx="6" fill="url(#rbAccent)" />
    <text x="125" y="238" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">⚡ Generate Formatted Resume</text>
