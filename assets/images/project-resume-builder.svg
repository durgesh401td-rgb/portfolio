    <text x="18" y="140" font-family="sans-serif" font-size="8" fill="#475569">• Languages: C, C++, Python, JavaScript</text>
    <text x="18" y="154" font-family="sans-serif" font-size="8" fill="#475569">• IoT / Hardware: ESP8266, ultrasonic &amp; distance sensors</text>

    <text x="18" y="178" font-family="sans-serif" font-weight="bold" font-size="10" fill="#334155">PROJECTS</text>
    <text x="18" y="194" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0f172a">Smart Plant Monitoring System using IoT</text>
    <text x="18" y="208" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0f172a">IoT Smart Lighting &amp; Distance Alert System</text>
    
    <rect x="18" y="230" width="115" height="28" rx="4" fill="#0f172a" />
    <text x="75" y="248" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="10" fill="#ffffff">📥 Download PDF</text>
