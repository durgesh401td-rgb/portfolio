  <text x="510" y="26" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#93c5fd">HTML / CSS / JS</text>

  <!-- Left: Form Input Wizard Mockup -->
  <g transform="translate(25, 65)">
