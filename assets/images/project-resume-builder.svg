  <!-- Right: Formatted Resume Sheet Preview -->
  <g transform="translate(295, 65)">
    <rect width="280" height="286" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Top banner on sheet -->
