<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="algoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="600" height="380" rx="12" fill="url(#algoBg)" />
  
  <!-- Header -->
  <rect width="600" height="46" rx="12" fill="#1f2937" />
  <rect y="36" width="600" height="10" fill="#1f2937" />
  <circle cx="24" cy="23" r="5" fill="#ef4444" />
  <circle cx="40" cy="23" r="5" fill="#f59e0b" />
  <circle cx="56" cy="23" r="5" fill="#10b981" />
  <text x="82" y="27" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#facc15">⚡ AlgoScope | Pathfinding &amp; Sorting Visualizer Suite</text>
  
  <rect x="470" y="12" width="110" height="22" rx="4" fill="#ca8a04" />
  <text x="525" y="27" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#ffffff">Dijkstra / A*</text>

  <!-- Left: Pathfinding Grid Visualization -->
  <g transform="translate(25, 65)">
    <rect width="260" height="295" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="24" font-family="sans-serif" font-weight="bold" font-size="11" fill="#e5e7eb">Graph Grid: Dijkstra &amp; BFS Simulation</text>

    <!-- Grid representation with visited, wall, and path nodes -->
    <g transform="translate(15, 38)">
      <!-- Render 8x8 matrix blocks -->
      <!-- Start Node -->
      <rect x="0" y="0" width="26" height="26" rx="3" fill="#10b981" />
      <text x="13" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">S</text>

      <!-- Target Node -->
      <rect x="196" y="168" width="26" height="26" rx="3" fill="#ef4444" />
      <text x="209" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">E</text>

      <!-- Walls -->
      <rect x="84" y="28" width="26" height="26" rx="3" fill="#374151" />
      <rect x="84" y="56" width="26" height="26" rx="3" fill="#374151" />
      <rect x="84" y="84" width="26" height="26" rx="3" fill="#374151" />
      <rect x="84" y="112" width="26" height="26" rx="3" fill="#374151" />
      <rect x="140" y="84" width="26" height="26" rx="3" fill="#374151" />
      <rect x="140" y="112" width="26" height="26" rx="3" fill="#374151" />
      <rect x="140" y="140" width="26" height="26" rx="3" fill="#374151" />

      <!-- Shortest Path Gold Nodes -->
      <rect x="28" y="0" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="56" y="0" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="56" y="28" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="56" y="56" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="56" y="84" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="56" y="112" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="56" y="140" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="84" y="140" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="112" y="140" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="112" y="168" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="140" y="168" width="26" height="26" rx="3" fill="#facc15" />
      <rect x="168" y="168" width="26" height="26" rx="3" fill="#facc15" />

      <!-- Explored / Visited blue nodes -->
      <rect x="0" y="28" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="0" y="56" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="28" y="28" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="28" y="56" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="112" y="0" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="140" y="0" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="112" y="28" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="112" y="56" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="168" y="28" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
      <rect x="196" y="56" width="26" height="26" rx="3" fill="#1e3a8a" opacity="0.6" />
    </g>

    <text x="14" y="278" font-family="monospace" font-size="10" fill="#34d399">✓ Optimal Path: 14 steps | Time: 18ms</text>
  </g>

  <!-- Right: Sorting Bar Visualization (QuickSort & MergeSort) -->
  <g transform="translate(305, 65)">
    <rect width="270" height="295" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="24" font-family="sans-serif" font-weight="bold" font-size="11" fill="#e5e7eb">Sorting Array: QuickSort Dual-Pivot</text>

    <!-- Bars -->
    <g transform="translate(20, 45)">
      <!-- Dynamic sorting bars -->
      <rect x="0" y="120" width="12" height="80" rx="2" fill="#38bdf8" />
      <rect x="16" y="90" width="12" height="110" rx="2" fill="#38bdf8" />
      <rect x="32" y="140" width="12" height="60" rx="2" fill="#38bdf8" />
      <rect x="48" y="70" width="12" height="130" rx="2" fill="#38bdf8" />
      <rect x="64" y="110" width="12" height="90" rx="2" fill="#38bdf8" />
      <!-- Pivot element (Yellow) -->
      <rect x="80" y="50" width="12" height="150" rx="2" fill="#facc15" />
      <rect x="96" y="130" width="12" height="70" rx="2" fill="#38bdf8" />
      <!-- Active comparing elements (Red) -->
      <rect x="112" y="30" width="12" height="170" rx="2" fill="#f43f5e" />
      <rect x="128" y="100" width="12" height="100" rx="2" fill="#f43f5e" />
      <rect x="144" y="80" width="12" height="120" rx="2" fill="#38bdf8" />
      <!-- Sorted section (Green) -->
      <rect x="160" y="60" width="12" height="140" rx="2" fill="#10b981" />
      <rect x="176" y="40" width="12" height="160" rx="2" fill="#10b981" />
      <rect x="192" y="20" width="12" height="180" rx="2" fill="#10b981" />
      <rect x="208" y="10" width="12" height="190" rx="2" fill="#10b981" />
    </g>

    <!-- Sorting Metrics Box -->
    <rect x="15" y="255" width="240" height="28" rx="4" fill="#1f2937" />
    <text x="24" y="273" font-family="monospace" font-size="10" fill="#93c5fd">Comparisons: 1,420 | Swaps: 382</text>
  </g>
</svg>
