<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="lightBeam" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#lightBg)" />

  <!-- Header -->
  <rect width="600" height="44" rx="12" fill="#0f172a" />
  <rect y="34" width="600" height="10" fill="#0f172a" />
  <circle cx="24" cy="22" r="5" fill="#ef4444" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" />
  <circle cx="56" cy="22" r="5" fill="#10b981" />
  <text x="82" y="27" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#facc15">💡 IoT Smart Lighting &amp; Distance Alert System</text>
  <rect x="460" y="11" width="120" height="22" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="1" />
  <text x="520" y="26" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#c7d2fe">ESP8266 + LDR</text>

  <!-- Left: Sensor Circuit & Visual -->
  <g transform="translate(25, 65)">
    <!-- Glowing light fixture -->
    <rect width="250" height="286" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="125" cy="80" r="45" fill="url(#lightBeam)" />
    <!-- Bulb graphic -->
    <circle cx="125" cy="70" r="22" fill="#fef08a" stroke="#eab308" stroke-width="2" />
    <path d="M118 92 L132 92 L128 102 L122 102 Z" fill="#64748b" />
    <text x="125" y="125" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fef08a">Adaptive PWM RGB Lighting</text>

    <!-- Ultrasonic sensor graphic -->
    <g transform="translate(45, 145)">
      <rect width="160" height="55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="45" cy="27" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
      <circle cx="115" cy="27" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
      <text x="80" y="48" text-anchor="middle" font-family="monospace" font-size="8" fill="#38bdf8">HC-SR04</text>
    </g>

    <!-- Distance readout -->
    <rect x="35" y="220" width="180" height="45" rx="6" fill="#020617" stroke="#eab308" stroke-width="1" />
    <text x="45" y="238" font-family="sans-serif" font-size="9" fill="#94a3b8">MEASURED DISTANCE</text>
    <text x="45" y="256" font-family="monospace" font-weight="bold" font-size="14" fill="#facc15">42.5 cm [ALERT: NEAR]</text>
  </g>

  <!-- Right: Control Logic & State Monitor -->
  <g transform="translate(295, 65)">
    <rect width="280" height="286" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="28" font-family="sans-serif" font-weight="bold" font-size="12" fill="#e2e8f0">Telemetry &amp; Behavior Rules</text>

    <!-- Rule 1: LDR status -->
    <g transform="translate(18, 45)">
      <rect width="244" height="60" rx="6" fill="#1e293b" />
      <text x="14" y="22" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f8fafc">Ambient Lux (LDR)</text>
      <text x="14" y="44" font-family="monospace" font-size="10" fill="#38bdf8">Lux: 140 | Mode: Dark Trigger</text>
      <circle cx="215" cy="30" r="12" fill="#854d0e" />
      <text x="215" y="34" text-anchor="middle" font-size="10" fill="#fef08a">🌙</text>
    </g>

    <!-- Rule 2: Distance Alert -->
    <g transform="translate(18, 115)">
      <rect width="244" height="60" rx="6" fill="#1e293b" />
      <text x="14" y="22" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f8fafc">Ultrasonic Proximity Zone</text>
      <text x="14" y="44" font-family="monospace" font-size="10" fill="#f43f5e">&lt; 50 cm: RGB RED + Pulse</text>
      <circle cx="215" cy="30" r="12" fill="#991b1b" />
      <text x="215" y="34" text-anchor="middle" font-size="10" fill="#ffffff">🚨</text>
    </g>

    <!-- System Console Output -->
    <rect x="18" y="185" width="244" height="85" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="205" font-family="monospace" font-size="8" fill="#facc15">[ESP8266] Loop cycle: 100ms</text>
    <text x="26" y="220" font-family="monospace" font-size="8" fill="#38bdf8">[LDR-A0] ADC Value = 824 (Low Light)</text>
    <text x="26" y="235" font-family="monospace" font-size="8" fill="#f43f5e">[Trigger] Object detected at 42.5cm</text>
    <text x="26" y="250" font-family="monospace" font-size="8" fill="#4ade80">[RGB Output] Activating distance warning</text>
  </g>
</svg>
