<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="50%" stop-color="#18122B" />
      <stop offset="100%" stop-color="#0F0C20" />
    </linearGradient>
    <radialGradient id="voiceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#auraBg)" />
  
  <!-- Header -->
  <rect width="600" height="44" rx="12" fill="#131127" />
  <rect y="34" width="600" height="10" fill="#131127" />
  <circle cx="24" cy="22" r="5" fill="#ef4444" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" />
  <circle cx="56" cy="22" r="5" fill="#10b981" />
  <text x="82" y="27" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#c084fc">🎙️ AI Voice Assistant — "Aura" | Autonomous Agentic ReAct</text>
  <rect x="465" y="11" width="115" height="22" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="1" />
  <text x="522" y="26" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#c7d2fe">Gemini AI / Python</text>

  <!-- Left: Glowing AI Soundwave Orb -->
  <g transform="translate(25, 65)">
    <rect width="255" height="286" rx="8" fill="#120e24" stroke="#2e2354" stroke-width="1" />
    <circle cx="127" cy="110" r="75" fill="url(#voiceGlow)" />
    <circle cx="127" cy="110" r="45" fill="#2e1065" stroke="#a855f7" stroke-width="2" />
    <circle cx="127" cy="110" r="25" fill="#6b21a8" />

    <!-- Sound waves -->
    <path d="M 82 110 Q 104 70 127 110 T 172 110" fill="none" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round" />
    <path d="M 97 110 Q 112 85 127 110 T 157 110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    
    <text x="127" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#f3e8ff">"Aura" Listening...</text>
    <text x="127" y="222" text-anchor="middle" font-family="monospace" font-size="10" fill="#a855f7">Google Gemini Multimodal API</text>
    <rect x="40" y="240" width="175" height="24" rx="12" fill="#3b0764" stroke="#c084fc" stroke-width="1" />
    <text x="127" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#e9d5ff">● Agentic ReAct Engine Active</text>
  </g>

  <!-- Right: Terminal Execution Trace -->
  <g transform="translate(295, 65)">
    <rect width="280" height="286" rx="8" fill="#090714" stroke="#2e2354" stroke-width="1" />
    <rect width="280" height="28" rx="8" fill="#18122b" />
    <text x="16" y="18" font-family="monospace" font-size="10" fill="#a78bfa">Windows Autonomous Agent</text>

    <!-- Trace Logs -->
    <text x="14" y="52" font-family="monospace" font-size="9" fill="#38bdf8">&gt; User (Voice): "Summarize latest notes"</text>
    <text x="14" y="74" font-family="monospace" font-size="9" fill="#c084fc">[Thought] Need to inspect desktop notes</text>
    <text x="14" y="94" font-family="monospace" font-size="9" fill="#eab308">[Action] win32_read_file('notes.txt')</text>
    <text x="14" y="114" font-family="monospace" font-size="9" fill="#34d399">[Observation] 4 items found</text>
    
    <line x1="14" y1="130" x2="266" y2="130" stroke="#2e2354" stroke-width="1" />
    
    <text x="14" y="152" font-family="monospace" font-size="9" fill="#c084fc">[Gemini Call] Processing multimodal prompt...</text>
    <text x="14" y="172" font-family="monospace" font-size="9" fill="#38bdf8">&gt; Aura (TTS): "Here is your summary..."</text>
    <text x="14" y="196" font-family="monospace" font-size="9" fill="#4ade80">✓ Task finalized in 420ms</text>

    <rect x="14" y="220" width="252" height="48" rx="6" fill="#18122b" stroke="#3b0764" stroke-width="1" />
    <text x="24" y="238" font-family="sans-serif" font-weight="bold" font-size="10" fill="#e9d5ff">Autonomous Desktop Capabilities:</text>
    <text x="24" y="254" font-family="sans-serif" font-size="9" fill="#c084fc">Voice I/O · Win32 Automation · LLM Reasoning</text>
  </g>
</svg>
