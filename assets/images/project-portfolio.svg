<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glowHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#portBg)" />
  
  <!-- Header bar -->
  <rect width="600" height="42" rx="12" fill="#1f2937" />
  <rect y="30" width="600" height="12" fill="#1f2937" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="140" y="10" width="320" height="22" rx="11" fill="#111827" stroke="#374151" stroke-width="1" />
  <text x="300" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ca3af">https://durgesh-portfolio.vercel.app</text>

  <!-- Mini Mockup Layout inside -->
  <!-- Navigation Header inside site -->
  <g transform="translate(30, 60)">
    <rect width="540" height="36" rx="6" fill="#1f2937" opacity="0.9" />
    <text x="20" y="23" font-family="sans-serif" font-weight="bold" font-size="13" fill="#38bdf8">&lt;Durgesh.dev /&gt;</text>
    <text x="360" y="22" font-family="sans-serif" font-size="11" fill="#d1d5db">About  Skills  Projects  Contact</text>
    <rect x="495" y="8" width="32" height="20" rx="10" fill="#374151" />
    <circle cx="519" cy="18" r="7" fill="#fbbf24" />
  </g>

  <!-- Hero Section Mockup -->
  <g transform="translate(30, 110)">
    <!-- Text side -->
    <rect x="0" y="20" width="120" height="12" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="0" y="42" width="220" height="26" rx="4" fill="url(#glowHeader)" />
    <rect x="0" y="78" width="260" height="10" rx="3" fill="#9ca3af" />
    <rect x="0" y="96" width="230" height="10" rx="3" fill="#6b7280" />
    
    <!-- CTA buttons -->
    <rect x="0" y="125" width="100" height="28" rx="6" fill="#6366f1" />
    <text x="50" y="143" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">View Work</text>

    <rect x="110" y="125" width="100" height="28" rx="6" fill="none" stroke="#4b5563" stroke-width="1.5" />
    <text x="160" y="143" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e5e7eb">Get in Touch</text>

    <!-- Visual Avatar side -->
    <g transform="translate(350, 10)">
      <circle cx="80" cy="80" r="70" fill="#1f2937" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
      <circle cx="80" cy="80" r="58" fill="#111827" />
      <circle cx="80" cy="65" r="24" fill="#38bdf8" opacity="0.8" />
      <path d="M45 125 C45 100, 60 90, 80 90 C100 90, 115 100, 115 125 Z" fill="#6366f1" />
    </g>
  </g>

  <!-- Feature Strip at bottom -->
  <g transform="translate(30, 290)">
    <rect width="165" height="65" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="14" y="26" font-family="sans-serif" font-size="10" fill="#9ca3af">PERFORMANCE</text>
    <text x="14" y="50" font-family="sans-serif" font-weight="bold" font-size="16" fill="#10b981">100 / 100 ⚡</text>

    <rect x="187" width="165" height="65" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="201" y="26" font-family="sans-serif" font-size="10" fill="#9ca3af">DEPLOYMENT</text>
    <text x="201" y="50" font-family="sans-serif" font-weight="bold" font-size="16" fill="#38bdf8">Vercel Edge ▲</text>

    <rect x="374" width="165" height="65" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="388" y="26" font-family="sans-serif" font-size="10" fill="#9ca3af">RESPONSIVENESS</text>
    <text x="388" y="50" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fbbf24">Fluid 320px-4K</text>
  </g>
