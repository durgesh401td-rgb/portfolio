    <text x="180" y="62" text-anchor="end" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff">₹ 4,200</text>

    <rect x="14" y="85" width="182" height="35" rx="4" fill="#064e3b" />
    <text x="22" y="100" font-family="sans-serif" font-size="10" fill="#a7f3d0">IoT Hardware &amp; Sensors</text>
    <text x="180" y="107" text-anchor="end" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff">₹ 2,850</text>

    <rect x="14" y="130" width="182" height="35" rx="4" fill="#064e3b" />
    <text x="22" y="145" font-family="sans-serif" font-size="10" fill="#a7f3d0">Monthly Savings Deposit</text>
    <text x="180" y="152" text-anchor="end" font-family="sans-serif" font-weight="bold" font-size="11" fill="#34d399">₹ 8,000</text>
