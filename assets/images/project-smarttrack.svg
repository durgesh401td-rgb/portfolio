    <text x="14" y="52" font-family="sans-serif" font-weight="bold" font-size="20" fill="#34d399">₹ 1,84,500</text>

    <rect x="190" width="165" height="65" rx="6" fill="#022c22" stroke="#047857" stroke-width="1" />
    <text x="204" y="24" font-family="sans-serif" font-size="10" fill="#a7f3d0">COMPOUND EST. (10Y)</text>
    <text x="204" y="52" font-family="sans-serif" font-weight="bold" font-size="20" fill="#38bdf8">₹ 5,72,000</text>

    <rect x="380" width="170" height="65" rx="6" fill="#022c22" stroke="#047857" stroke-width="1" />
    <text x="394" y="24" font-family="sans-serif" font-size="10" fill="#a7f3d0">SYNC DESTINATION</text>
    <text x="394" y="50" font-family="sans-serif" font-weight="bold" font-size="14" fill="#facc15">Google Sheets API 🟢</text>
  </g>

  <!-- Bottom: Chart & Calculator -->
  <g transform="translate(25, 145)">
    <!-- Chart Box -->
    <rect width="320" height="205" rx="8" fill="#021f18" stroke="#065f46" stroke-width="1" />
    <text x="16" y="26" font-family="sans-serif" font-weight="bold" font-size="12" fill="#d1fae5">Compound Growth Projections (CAGR 12%)</text>
    
    <!-- Grid -->
    <line x1="25" y1="60" x2="300" y2="60" stroke="#064e3b" stroke-dasharray="3 3" />
    <line x1="25" y1="110" x2="300" y2="110" stroke="#064e3b" stroke-dasharray="3 3" />
    <line x1="25" y1="160" x2="300" y2="160" stroke="#047857" stroke-width="1.5" />

    <!-- Area Chart -->
    <path d="M 25 150 Q 100 130 170 100 T 300 45 L 300 160 L 25 160 Z" fill="url(#growthGrad)" />
    <path d="M 25 150 Q 100 130 170 100 T 300 45" fill="none" stroke="#34d399" stroke-width="3" />
    
    <circle cx="170" cy="100" r="4" fill="#34d399" stroke="#ffffff" stroke-width="1" />
    <circle cx="300" cy="45" r="5" fill="#facc15" stroke="#ffffff" stroke-width="1" />
    <text x="235" y="40" font-family="monospace" font-size="9" fill="#facc15">+210% Growth</text>
    <text x="25" y="185" font-family="monospace" font-size="9" fill="#6ee7b7">✓ Real-time Sync via Google Apps Script</text>
  </g>

  <!-- Right: Calculator & Expense breakdown -->
  <g transform="translate(365, 145)">
    <rect width="210" height="205" rx="8" fill="#021f18" stroke="#065f46" stroke-width="1" />
    <text x="14" y="24" font-family="sans-serif" font-weight="bold" font-size="11" fill="#d1fae5">Expense Breakdown</text>

    <rect x="14" y="40" width="182" height="35" rx="4" fill="#064e3b" />
