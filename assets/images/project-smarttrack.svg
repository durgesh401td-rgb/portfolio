<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="growthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#stBg)" />

  <!-- Header -->
  <rect width="600" height="44" rx="12" fill="#022c22" />
  <rect y="34" width="600" height="10" fill="#022c22" />
  <circle cx="24" cy="22" r="5" fill="#ef4444" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" />
  <circle cx="56" cy="22" r="5" fill="#10b981" />
  <text x="82" y="27" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#6ee7b7">📊 SmartTrack | Expense &amp; Compound Investment Portal</text>
  <rect x="445" y="11" width="135" height="22" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1" />
  <text x="512" y="26" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#a7f3d0">Google Apps Script</text>

  <!-- KPI Row -->
  <g transform="translate(25, 65)">
    <rect width="165" height="65" rx="6" fill="#022c22" stroke="#047857" stroke-width="1" />
