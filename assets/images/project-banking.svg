<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322" />
      <stop offset="100%" stop-color="#142640" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="600" height="380" rx="12" fill="url(#bankBg)" />
  
  <!-- Header Bar -->
  <rect width="600" height="46" rx="12" fill="#0f1f33" />
  <rect y="36" width="600" height="10" fill="#0f1f33" />
  <circle cx="24" cy="23" r="5" fill="#ef4444" />
  <circle cx="40" cy="23" r="5" fill="#f59e0b" />
  <circle cx="56" cy="23" r="5" fill="#10b981" />
  <text x="82" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#38bdf8">☕ JavaCore Banking &amp; Multi-Threaded Ledger Engine</text>
  <rect x="475" y="12" width="105" height="22" rx="4" fill="url(#javaGrad)" />
  <text x="527" y="27" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#ffffff">Java 17 / JDBC</text>

  <!-- Left Column: Virtual Debit Card & Quick Actions -->
  <g transform="translate(25, 65)">
    <!-- Credit/Debit Card Visual -->
    <rect width="240" height="135" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" />
    <!-- Chip -->
    <rect x="25" y="30" width="36" height="26" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
    <text x="25" y="80" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="3">•••• •••• •••• 9042</text>
    <text x="25" y="110" font-family="sans-serif" font-size="9" fill="#fef3c7">ACCOUNT HOLDER</text>
    <text x="25" y="124" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">DURGESH SONAR</text>
    <text x="180" y="124" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">09/29</text>

    <!-- Metrics Box -->
    <rect y="150" width="240" height="145" rx="8" fill="#0f1f33" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="174" font-family="sans-serif" font-size="11" fill="#94a3b8">Total Vault Reserve</text>
    <text x="16" y="200" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">₹ 2,450,800.00</text>
    <line x1="16" y1="215" x2="224" y2="215" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="235" font-family="monospace" font-size="10" fill="#34d399">✓ Multi-thread Safe: ReentrantLock</text>
    <text x="16" y="254" font-family="monospace" font-size="10" fill="#34d399">✓ ACID Transaction Manager: OK</text>
    <text x="16" y="273" font-family="monospace" font-size="10" fill="#34d399">✓ SHA-256 Audit Hashing: Active</text>
  </g>

  <!-- Right Column: Live Transaction Ledger -->
  <g transform="translate(285, 65)">
    <rect width="290" height="295" rx="8" fill="#0f1f33" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="26" font-family="sans-serif" font-weight="bold" font-size="13" fill="#e2e8f0">Real-Time Transaction Stream</text>
    <rect x="200" y="12" width="75" height="18" rx="4" fill="#064e3b" />
    <text x="237" y="24" text-anchor="middle" font-family="monospace" font-size="9" fill="#6ee7b7">● Connected</text>

    <!-- Ledger Rows -->
    <!-- Item 1 -->
    <g transform="translate(12, 42)">
      <rect width="266" height="52" rx="6" fill="#142640" />
      <circle cx="22" cy="26" r="12" fill="#065f46" />
      <text x="22" y="30" text-anchor="middle" font-weight="bold" font-size="11" fill="#34d399">↓</text>
      <text x="44" y="20" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f8fafc">Client NEFT Inward</text>
      <text x="44" y="34" font-family="monospace" font-size="9" fill="#94a3b8">TXN_ID: #892837482</text>
      <text x="254" y="24" text-anchor="end" font-family="sans-serif" font-weight="bold" font-size="12" fill="#34d399">+₹45,000.00</text>
      <text x="254" y="38" text-anchor="end" font-family="sans-serif" font-size="8" fill="#64748b">10:42:15</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(12, 102)">
      <rect width="266" height="52" rx="6" fill="#142640" />
      <circle cx="22" cy="26" r="12" fill="#7f1d1d" />
      <text x="22" y="30" text-anchor="middle" font-weight="bold" font-size="11" fill="#f87171">↑</text>
      <text x="44" y="20" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f8fafc">Cloud Server Hosting</text>
      <text x="44" y="34" font-family="monospace" font-size="9" fill="#94a3b8">TXN_ID: #741928301</text>
      <text x="254" y="24" text-anchor="end" font-family="sans-serif" font-weight="bold" font-size="12" fill="#f87171">-₹3,250.00</text>
      <text x="254" y="38" text-anchor="end" font-family="sans-serif" font-size="8" fill="#64748b">09:15:02</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(12, 162)">
      <rect width="266" height="52" rx="6" fill="#142640" />
      <circle cx="22" cy="26" r="12" fill="#065f46" />
      <text x="22" y="30" text-anchor="middle" font-weight="bold" font-size="11" fill="#34d399">↓</text>
      <text x="44" y="20" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f8fafc">Software Consulting</text>
      <text x="44" y="34" font-family="monospace" font-size="9" fill="#94a3b8">TXN_ID: #551293847</text>
      <text x="254" y="24" text-anchor="end" font-family="sans-serif" font-weight="bold" font-size="12" fill="#34d399">+₹18,500.00</text>
      <text x="254" y="38" text-anchor="end" font-family="sans-serif" font-size="8" fill="#64748b">Yesterday</text>
    </g>

    <!-- Console footprint -->
    <rect x="12" y="224" width="266" height="58" rx="6" fill="#091322" stroke="#1e3a5f" stroke-width="1" />
    <text x="20" y="242" font-family="monospace" font-size="9" fill="#facc15">[JVM Thread-4] Ledger lock acquired</text>
    <text x="20" y="256" font-family="monospace" font-size="9" fill="#38bdf8">[JDBC Pool] Connection #18 validated</text>
    <text x="20" y="270" font-family="monospace" font-size="9" fill="#4ade80">[Commit] State synchronized successfully</text>
  </g>
</svg>
