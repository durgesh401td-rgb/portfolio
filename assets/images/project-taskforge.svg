<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="col1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="col2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="col3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Browser window frame -->
  <rect width="600" height="380" rx="12" fill="url(#bgGrad)" />
  
  <!-- Window titlebar -->
  <rect width="600" height="42" rx="12" fill="#1e293b" />
  <rect y="30" width="600" height="12" fill="#1e293b" />
  <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5.5" fill="#10b981" />
  
  <!-- Search/URL bar -->
  <rect x="120" y="10" width="360" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="300" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">https://taskforge.durgesh.dev</text>

  <!-- Top App Bar -->
  <rect x="20" y="55" width="560" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="38" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#38bdf8">⚡ TaskForge | Agile Sprint Workspace</text>
  <rect x="470" y="62" width="95" height="24" rx="6" fill="#3b82f6" />
  <text x="517" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#ffffff">+ New Task</text>

  <!-- 3 Kanban Columns -->
  <!-- Col 1: To Do -->
  <g transform="translate(20, 105)">
    <rect width="176" height="255" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="176" height="6" rx="3" fill="url(#col1Grad)" />
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#93c5fd">TO DO (3)</text>

    <!-- Card 1 -->
    <rect x="10" y="40" width="156" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <text x="20" y="60" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f1f5f9">Design REST API Specs</text>
    <rect x="20" y="72" width="45" height="14" rx="3" fill="#1e3a8a" />
    <text x="42" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#93c5fd">Backend</text>
    <circle cx="150" cy="80" r="8" fill="#38bdf8" />
    <text x="150" y="83" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#0f172a" font-weight="bold">DS</text>

    <!-- Card 2 -->
    <rect x="10" y="115" width="156" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <text x="20" y="135" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f1f5f9">Setup CI/CD Pipeline</text>
    <rect x="20" y="147" width="42" height="14" rx="3" fill="#831843" />
    <text x="41" y="157" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f472b6">DevOps</text>
  </g>

  <!-- Col 2: In Progress -->
  <g transform="translate(212, 105)">
    <rect width="176" height="255" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="176" height="6" rx="3" fill="url(#col2Grad)" />
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#c4b5fd">IN PROGRESS (2)</text>

    <!-- Card 1 -->
    <rect x="10" y="40" width="156" height="75" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="20" y="60" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f1f5f9">Auth JWT Middleware</text>
    <rect x="20" y="72" width="40" height="14" rx="3" fill="#4c1d95" />
    <text x="40" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#c4b5fd">Security</text>
    <!-- Mini progress bar -->
    <rect x="20" y="96" width="136" height="5" rx="2" fill="#334155" />
    <rect x="20" y="96" width="90" height="5" rx="2" fill="#a78bfa" />
  </g>

  <!-- Col 3: Done -->
  <g transform="translate(404, 105)">
    <rect width="176" height="255" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect width="176" height="6" rx="3" fill="url(#col3Grad)" />
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#6ee7b7">COMPLETED (8)</text>

    <!-- Card 1 -->
    <rect x="10" y="40" width="156" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <text x="20" y="60" font-family="sans-serif" font-weight="bold" font-size="11" fill="#94a3b8" text-decoration="line-through">Database Schema</text>
    <rect x="20" y="72" width="48" height="14" rx="3" fill="#064e3b" />
    <text x="44" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#34d399">✓ Verified</text>
  </g>
</svg>
