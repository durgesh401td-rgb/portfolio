<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pyDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#152445" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="pyBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="600" height="380" rx="12" fill="url(#pyDarkBg)" />
  
  <!-- Header -->
  <rect width="600" height="46" rx="12" fill="#101c38" />
  <rect y="36" width="600" height="10" fill="#101c38" />
  <circle cx="24" cy="23" r="5" fill="#ef4444" />
  <circle cx="40" cy="23" r="5" fill="#f59e0b" />
  <circle cx="56" cy="23" r="5" fill="#10b981" />
  <text x="82" y="27" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#38bdf8">🐍 PyInsight | Automated Data Processing &amp; Statistical Engine</text>
  <rect x="470" y="12" width="110" height="22" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
  <text x="525" y="27" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#93c5fd">Python 3.11</text>

  <!-- KPI Cards Row -->
  <g transform="translate(20, 60)">
    <!-- KPI 1 -->
    <rect width="170" height="60" rx="6" fill="#101c38" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8">DATASET RECORDS</text>
    <text x="14" y="48" font-family="sans-serif" font-weight="bold" font-size="20" fill="#f8fafc">1.28M <tspan font-size="11" fill="#34d399">▲ +12%</tspan></text>

    <!-- KPI 2 -->
    <rect x="195" width="170" height="60" rx="6" fill="#101c38" stroke="#1e293b" stroke-width="1" />
    <text x="209" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8">MODEL ACCURACY</text>
    <text x="209" y="48" font-family="sans-serif" font-weight="bold" font-size="20" fill="#38bdf8">98.4% <tspan font-size="11" fill="#a78bfa">(F1 0.97)</tspan></text>

    <!-- KPI 3 -->
    <rect x="390" width="170" height="60" rx="6" fill="#101c38" stroke="#1e293b" stroke-width="1" />
    <text x="404" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8">BATCH EXECUTION</text>
    <text x="404" y="48" font-family="sans-serif" font-weight="bold" font-size="20" fill="#34d399">142 ms <tspan font-size="11" fill="#94a3b8">/ run</tspan></text>
  </g>

  <!-- Main Analytics Area: Chart + Terminal -->
  <g transform="translate(20, 135)">
    <!-- Chart Box -->
    <rect width="365" height="225" rx="8" fill="#101c38" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" font-family="sans-serif" font-weight="bold" font-size="12" fill="#cbd5e1">Predictive Trend Curve &amp; Outlier Detection</text>
    <line x1="16" y1="36" x2="349" y2="36" stroke="#1e293b" stroke-width="1" />
    
    <!-- Grid lines -->
    <line x1="30" y1="70" x2="345" y2="70" stroke="#1e293b" stroke-dasharray="3 3" />
    <line x1="30" y1="115" x2="345" y2="115" stroke="#1e293b" stroke-dasharray="3 3" />
    <line x1="30" y1="160" x2="345" y2="160" stroke="#1e293b" stroke-dasharray="3 3" />
    <line x1="30" y1="200" x2="345" y2="200" stroke="#334155" stroke-width="1.5" />

    <!-- Area & Sparkline -->
    <path d="M 30 180 Q 70 160 110 140 T 190 100 T 270 70 T 345 50 L 345 200 L 30 200 Z" fill="url(#chartGrad)" />
    <path d="M 30 180 Q 70 160 110 140 T 190 100 T 270 70 T 345 50" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Data points -->
    <circle cx="110" cy="140" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="190" cy="100" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="270" cy="70" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="345" cy="50" r="4" fill="#34d399" stroke="#ffffff" stroke-width="1.5" />

    <!-- Outlier callout -->
    <circle cx="225" cy="150" r="5" fill="#f43f5e" />
    <text x="235" y="154" font-family="monospace" font-size="9" fill="#f43f5e">Outlier [Z=3.2]</text>
  </g>

  <!-- Side Box: Python Script & Output -->
  <g transform="translate(400, 135)">
    <rect width="180" height="225" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
    <!-- Terminal bar -->
    <rect width="180" height="24" rx="8" fill="#1e293b" />
    <text x="12" y="16" font-family="monospace" font-size="10" fill="#94a3b8">bash: ~ analysis.py</text>

    <!-- Code lines -->
    <text x="10" y="44" font-family="monospace" font-size="9" fill="#60a5fa">import</text>
    <text x="50" y="44" font-family="monospace" font-size="9" fill="#f8fafc">pandas as pd</text>
    
    <text x="10" y="60" font-family="monospace" font-size="9" fill="#60a5fa">import</text>
    <text x="50" y="60" font-family="monospace" font-size="9" fill="#f8fafc">numpy as np</text>

    <text x="10" y="80" font-family="monospace" font-size="9" fill="#c084fc">df</text>
    <text x="25" y="80" font-family="monospace" font-size="9" fill="#f8fafc">= pd.read_parquet(</text>
    <text x="20" y="94" font-family="monospace" font-size="8" fill="#34d399">'data_stream.pq'</text>
    <text x="10" y="108" font-family="monospace" font-size="9" fill="#f8fafc">)</text>

    <text x="10" y="128" font-family="monospace" font-size="8" fill="#94a3b8"># Automated cleaning</text>
    <text x="10" y="142" font-family="monospace" font-size="9" fill="#f8fafc">df.dropna(inplace=True)</text>
    <text x="10" y="156" font-family="monospace" font-size="9" fill="#f8fafc">model.fit(df.values)</text>

    <line x1="8" y1="172" x2="172" y2="172" stroke="#1e293b" stroke-width="1" />
    <text x="10" y="190" font-family="monospace" font-size="8" fill="#34d399">&gt;&gt; Pipeline: SUCCESS</text>
    <text x="10" y="204" font-family="monospace" font-size="8" fill="#38bdf8">&gt;&gt; Exported: report.json</text>
    <text x="10" y="218" font-family="monospace" font-size="8" fill="#facc15">&gt;&gt; Listening on :5000</text>
  </g>
</svg>
