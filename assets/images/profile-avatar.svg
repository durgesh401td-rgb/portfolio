<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular aura -->
  <circle cx="200" cy="200" r="180" fill="url(#orbGrad)" filter="url(#glow)" opacity="0.4" />
  
  <!-- Outer orbital ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#avatarGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Inner glowing circle backdrop -->
  <circle cx="200" cy="200" r="150" fill="#0f172a" />
  
  <!-- Subtle tech grid pattern inside avatar -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="120" x2="300" y2="120" />
    <line x1="80" y1="160" x2="320" y2="160" />
    <line x1="80" y1="200" x2="320" y2="200" />
    <line x1="80" y1="240" x2="320" y2="240" />
    <line x1="100" y1="280" x2="300" y2="280" />
    <line x1="150" y1="80" x2="150" y2="320" />
    <line x1="200" y1="60" x2="200" y2="340" />
    <line x1="250" y1="80" x2="250" y2="320" />
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders & Torso -->
  <path d="M120 330 C120 265, 150 245, 200 245 C250 245, 280 265, 280 330 Z" fill="url(#avatarGrad)" opacity="0.95" />
  
  <!-- Hoodie / Collar accent -->
  <path d="M165 245 L200 285 L235 245 Z" fill="#0f172a" opacity="0.6" />
  <path d="M196 280 L196 325 M204 280 L204 325" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Head / Face silhouette -->
  <circle cx="200" cy="180" r="50" fill="#e2e8f0" />
  
  <!-- Stylish hair / tech cap -->
  <path d="M150 170 C150 130, 175 120, 200 120 C230 120, 252 135, 252 170 C240 155, 220 148, 200 148 C175 148, 160 158, 150 170 Z" fill="#1e293b" />
  
  <!-- Smart Glasses -->
  <rect x="165" y="165" width="28" height="18" rx="4" fill="none" stroke="#0284c7" stroke-width="3" />
  <rect x="207" y="165" width="28" height="18" rx="4" fill="none" stroke="#0284c7" stroke-width="3" />
  <line x1="193" y1="174" x2="207" y2="174" stroke="#0284c7" stroke-width="3" />

  <!-- Floating Tech Badges / Floating Orbits -->
  <!-- Java badge -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="22" fill="#1e293b" stroke="#f97316" stroke-width="2" />
    <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#fb923c">Java</text>
  </g>
  <!-- Python badge -->
  <g transform="translate(300, 110)">
    <circle cx="20" cy="20" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#38bdf8">Py</text>
  </g>
  <!-- JS / Web badge -->
  <g transform="translate(50, 250)">
    <circle cx="20" cy="20" r="22" fill="#1e293b" stroke="#facc15" stroke-width="2" />
    <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#facc15">JS</text>
  </g>
  <!-- Code badge -->
  <g transform="translate(310, 245)">
    <circle cx="20" cy="20" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#34d399">&lt;/&gt;</text>
  </g>

  <!-- Sparkles -->
  <circle cx="100" cy="70" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="310" cy="65" r="3" fill="#818cf8" filter="url(#glow)" />
  <circle cx="200" cy="40" r="4" fill="#67e8f9" filter="url(#glow)" />
</svg>
